name: Validate

on: [push]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '22'
      - run: npm install -g @tapestry-mud/cli@0.13.0
      - run: npm ci
      - run: npm test
      - run: npm run spec-lint
      - run: tapestry validate
