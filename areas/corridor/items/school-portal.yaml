  description: "An old door, if a door is a place the weave gives. Beyond it the pattern is small and slow and deliberate, the way a thing is when it was made to be learned from. Fall in there and it costs you the walk and nothing you carry - you keep every scrap of what you took in and everything you took off the floor. ENTER DOOR to walk it."
