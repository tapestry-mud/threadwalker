properties:
  quest_grant:
    description: "Quest ID granted when player enters this room"
    type: string
    applies_to: [room]
  weaver_opener_seen:
    description: >-
      True once the Weaver first-login opener cutscene has fully completed
      (naturally or via skip) for this player. Registered so player-save
      hygiene does not drop it -- an unset/false value means the opener
      still needs to play on the player's next connect (character.created
      or player.login), which also covers a disconnect mid-cutscene: the
      flag is set in onComplete, never at cutscene start, so an interrupted
      opener replays from the top on the very next login instead of
      stranding the player with no path into the game.
    type: bool
    applies_to: [player]

  # Thread-portal wiring surface (spec 4.2). Carried on any item tagged thread_portal
  # or hub_portal in areas/corridor/items/ - these properties ARE the wiring, not
  # decoration, so a portal's fields fully describe how it mints or where it lands.
  portal_kind:
    description: "Which kind of portal this fixture is: hub (walks the player from the corridor back to the hub) or thread (walks the player into a thread run)"
    type: string
    applies_to: [item]
  template_id:
    description: >-
      The thread template this portal mints from. A bake-time value written by
      bakeTemplate (oracle-week-<seedhex>); the sentinel REPLACE_AT_BAKE means the
      thread has not been baked yet, and the portal fails closed with "That thread
      is not woven yet." rather than misbehaving.
    type: string
    applies_to: [item]
  band_min:
    description: "The minimum level this portal's normal run mints at, regardless of who walks in"
    type: int
    applies_to: [item]
  band_max:
    description: "The maximum level this portal's normal run mints at"
    type: int
    applies_to: [item]
  unraveling_boost:
    description: "Levels added on top of the normal band when this portal's Unraveling variant mints"
    type: int
    applies_to: [item]
