name: threadwalker
# Engine version pin (Task 16 Step 1, updated Task 17) - the real, current, TAGGED version.
# world.resetArea (Task 1) AND the cutscene-player API (Task 17, tapestry.cutscene.*) both
# landed AFTER this tag was cut and are NOT included here yet (see the matching comment in
# pack.yaml for the full trace). Ship must bump this to a new engine tag cut off current
# master before deploying threadwalker's week one content + the Weaver opener, which rely on
# resetArea (grind-death repop, the ward-gate hook) and the cutscene player respectively.
engine:
  version: "0.1.52"
  channel: stable
  mode: docker
  image: ghcr.io/tapestry-mud/tapestry
  network: tapestry_default
  # LF already holds the default 4000/4001 on the shared droplet; this instance
  # stands up alongside it (not in place of it), so it needs its own host ports.
  # Requires tapestry-cli >=0.14.0 (engine.host_ports; see its docker-host-ports
  # change record). Container-internal ports are unchanged -- server.yaml keeps
  # telnet_port: 4000 / websocket_port: 4001.
  host_ports:
    telnet: 4010
    websocket: 4011
  # Host path on the droplet (deploy-readable); the file holds TAPESTRY_LLM_API_KEY
  # and TAPESTRY_ADMIN_PASSWORD. `tapestry start` injects it as `docker run --env-file`,
  # so deploys stop dropping the LLM key and the admin seed password stays out of the repo.
  env_file: /home/deploy/.threadwalker-secrets.env
# Pack floors (Task 16 Step 1) - pinned to @tapestry/core and @tapestry/
# oracle's CURRENT, ACTUAL pack.yaml versions (checked 2026-07-23). Both are
# merged dark past this plan's Tasks 2-13 under these SAME version numbers -
# neither has been bumped yet. Ship must re-verify and raise these once
# oracle/core actually ship this plan's features under new version numbers;
# see the matching comment in pack.yaml for the full trace.
dependencies:
  '@tapestry-mud/threadwalker': '0.2.1'
  '@tapestry/core': '0.1.26'
  '@tapestry/oracle': '0.7.0'
validation: strict
