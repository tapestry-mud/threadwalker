name: threadwalker
# Engine version pin - 0.1.56 raises the rest/sleep recovery multipliers to
# 4x/6x. Recovery downtime is dead time: at 2x/3x a level-1 player needed about
# twice as long asleep as the boss engagement that emptied them had lasted, and
# the gap between resting and sleeping was itself the difference between a
# winnable boss fight and a stalled one. 0.1.55 carried writeItemTemplate's
# modifiers pass-through (gear-carries-HP) and AttemptFlee's no_wander respect
# (closes S2-13). Docker mode pulls this exact tag.
engine:
  version: "0.1.56"
  channel: stable
  mode: docker
  image: ghcr.io/tapestry-mud/tapestry
  network: tapestry_default
  # LF already holds the default 4000/4001 on the shared droplet; this instance
  # stands up alongside it (not in place of it), so it needs its own host ports.
  # Requires tapestry-cli >=0.14.0 (engine.host_ports; see its docker-host-ports
  # change record). Container-internal ports are unchanged -- server.yaml keeps
  # telnet_port: 4000 / websocket_port: 4001.
  host_ports:
    telnet: 4010
    websocket: 4011
  # Host path on the droplet (deploy-readable); the file holds TAPESTRY_LLM_API_KEY
  # and TAPESTRY_ADMIN_PASSWORD. `tapestry start` injects it as `docker run --env-file`,
  # so deploys stop dropping the LLM key and the admin seed password stays out of the repo.
  env_file: /home/deploy/.threadwalker-secrets.env
# Pack floors - the versions that ship this patch lane's work (core 0.1.28,
# oracle 0.9.1, the latter including the same-day armor.ac sign hotfix). The
# self-pin tracks pack.yaml's own version (0.3.1) and MUST stay in sync with
# it (two fields, same package).
# EXACT versions the droplet installs. This is NOT the same list as pack.yaml's
# `dependencies:`, which carries compatibility FLOORS for the published pack.
# Only this block drives `tapestry update` on the server, so bumping pack.yaml
# alone publishes a new pack that the droplet then declines to install - it
# reports "up to date" against these pins and exits 0.
dependencies:
  '@tapestry-mud/threadwalker': '0.3.3'
  '@tapestry/core': '0.1.28'
  '@tapestry/oracle': '0.9.2'
validation: strict
